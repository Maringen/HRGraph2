<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Org Chart</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/reactflow@11.11.4/dist/umd/index.js"></script>
    <style>
        * { margin: 0; padding: 0; }
        html, body, #root { width: 100%; height: 100%; }
        body { font-family: sans-serif; background: #f0f0f0; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        var e = React.createElement;
        var useState = React.useState;
        var useEffect = React.useEffect;
        var useMemo = React.useMemo;
        var RF = ReactFlow;
        
        function NodeComp(props) {
            var data = props.data || {};
            return e('div', {
                style: {
                    padding: '10px 15px',
                    background: 'white',
                    borderRadius: '8px',
                    border: '2px solid #667eea',
                    boxShadow: '0 2px 6px rgba(0,0,0,0.1)',
                    minWidth: '130px',
                    textAlign: 'center'
                }
            }, [
                e('div', {style: {fontWeight: 'bold', fontSize: '13px', marginBottom: '4px'}}, data.label),
                e('div', {style: {fontSize: '11px', color: '#666'}}, data.position || ''),
                e('div', {style: {fontSize: '10px', color: '#999'}}, data.department || '')
            ]);
        }
        
        function App() {
            var nodesState = useState([]);
            var edgesState = useState([]);
            var loading = useState(true);
            var nodes = nodesState[0];
            var edges = edgesState[0];
            var setNodes = nodesState[1];
            var setEdges = edgesState[1];
            var setLoading = loading[1];
            
            var nodeTypes = useMemo(function() {
                return { customNode: NodeComp };
            }, []);
            
            useEffect(function() {
                fetch('/graph-g6').then(function(r) { return r.json(); }).then(function(data) {
                    var map = {};
                    
                    // Build employee map
                    data.nodes.filter(function(n) { return n.nodeType === 'Employee'; }).forEach(function(n) {
                        map[n.id] = { 
                            id: String(n.id), 
                            label: n.label || '?', 
                            position: '', 
                            department: '', 
                            children: []
                        };
                    });
                    
                    // Build tree
                    data.edges.forEach(function(ed) {
                        var s = String(ed.source), t = String(ed.target);
                        if (ed.label === 'REPORTS_TO' && map[s] && map[t]) {
                            map[t].children.push(s);
                            map[s].managerId = t;
                        }
                        if (ed.label === 'WORKS_IN' && map[s]) {
                            var p = data.nodes.find(function(x) { return String(x.id) === t; });
                            if (p) map[s].position = p.label || '';
                        }
                        if (ed.label === 'BELONGS_TO' && map[s]) {
                            var d = data.nodes.find(function(x) { return String(x.id) === t; });
                            if (d) map[s].department = d.label || '';
                        }
                    });
                    
                    // Get roots
                    var roots = Object.values(map).filter(function(n) { return !n.managerId; });
                    console.log('Found ' + roots.length + ' root nodes');
                    
                    // Traverse and collect nodes
                    var allNodes = [];
                    var allEdges = [];
                    var visited = {};
                    var level = 0;
                    
                    function traverse(id, currentLevel) {
                        if (visited[id]) return;
                        visited[id] = true;
                        
                        var node = map[id];
                        if (!node) return;
                        
                        allNodes.push({
                            id: id,
                            type: 'customNode',
                            position: { x: 0, y: currentLevel * 120 },
                            data: {
                                label: node.label,
                                position: node.position,
                                department: node.department
                            }
                        });
                        
                        node.children.forEach(function(childId) {
                            allEdges.push({
                                id: childId + '-' + id,
                                source: childId,
                                target: id,
                                type: 'smoothstep'
                            });
                            traverse(childId, currentLevel + 1);
                        });
                    }
                    
                    roots.forEach(function(r) { traverse(r.id, 0); });
                    console.log('Total nodes: ' + allNodes.length);
                    
                    // Group by level
                    var levels = {};
                    allNodes.forEach(function(n) {
                        var y = n.position.y;
                        if (!levels[y]) levels[y] = [];
                        levels[y].push(n);
                    });
                    
                    console.log('Levels found:', Object.keys(levels).map(function(y) { 
                        return 'y=' + y + ' (' + levels[y].length + ' nodes)'; 
                    }).join(', '));
                    
                    // Position nodes in each level
                    Object.keys(levels).forEach(function(y) {
                        var levelNodes = levels[y];
                        var totalWidth = levelNodes.length * 160;
                        var startX = -totalWidth / 2 + 80;
                        
                        levelNodes.forEach(function(n, i) {
                            n.position.x = startX + i * 160;
                            console.log('Node ' + n.data.label + ' at x=' + n.position.x + ', y=' + n.position.y);
                        });
                    });
                    
                    setNodes([].concat(allNodes));
                    setEdges([].concat(allEdges));
                    setLoading(false);
                });
            }, []);
            
            if (loading[0]) {
                return e('div', {style: {display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%'}}, 'Loading...');
            }
            
            return e('div', {style: {width: '100%', height: '100%'}},
                e(RF.ReactFlow, {nodes: nodes, edges: edges, nodeTypes: nodeTypes, fitView: true},
                    e(RF.Background, {variant: 'dots', gap: 12, size: 1}),
                    e(RF.Controls, null),
                    e(RF.MiniMap, {nodeColor: '#667eea'})
                )
            );
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(e(App));
    </script>
</body>
</html>
