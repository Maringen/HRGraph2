<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Flow Test</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/reactflow@11.11.4/dist/style.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/reactflow@11.11.4/dist/umd/index.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        console.log('React:', typeof React);
        console.log('ReactDOM:', typeof ReactDOM);
        console.log('ReactFlow:', typeof ReactFlow);
        
        const { useState } = React;
        const { ReactFlow: ReactFlowComponent, Background, Controls } = window.ReactFlow;

        const TestNode = ({ data }) => (
            <div style={{ 
                padding: '20px', 
                background: 'white', 
                borderRadius: '8px',
                border: '2px solid #667eea',
                minWidth: '150px'
            }}>
                <div style={{ fontWeight: 'bold' }}>{data.label}</div>
            </div>
        );
        
        const App = () => {
            const [nodes] = useState([
                { id: '1', type: 'testNode', position: { x: 100, y: 100 }, data: { label: 'Node 1' } },
                { id: '2', type: 'testNode', position: { x: 100, y: 200 }, data: { label: 'Node 2' } },
            ]);
            const [edges] = useState([
                { id: 'e1-2', source: '1', target: '2' }
            ]);
            
            return (
                <div style={{ height: '100vh', width: '100%' }}>
                    <ReactFlowComponent
                        nodes={nodes}
                        edges={edges}
                        nodeTypes={{ testNode: TestNode }}
                        fitView
                    >
                        <Controls />
                        <Background />
                    </ReactFlow>
                </div>
            );
        };
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
