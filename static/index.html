</div>
<div style="text-align:center;margin-bottom:20px;">

    <a href="/static/graph-view.html" style="background:white;color:#333;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:bold;display:inline-block;box-shadow:0 4px 6px rgba(0,0,0,0.1);margin-right:10px;">📊 Original View</a>

    <a href="http://localhost:3001" target="_blank" style="background:white;color:#ff9800;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:bold;display:inline-block;box-shadow:0 4px 6px rgba(0,0,0,0.1);">🗄️ FalkorDB Browser</a>
</div>

<!-- Stats -->
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px;">

    <div class="stat-box" data-type="Department" onclick="filterByType('Department')" style="background:white;padding:20px;border-radius:8px;text-align:center;box-shadow:0 4px 6px rgba(0,0,0,0.1);cursor:pointer;transition:all 0.2s ease;">

        <div data-translate="departments" style="color:#666;font-size:12px;">Departments</div>
    </div>
    <div class="stat-box" data-type="Position" onclick="filterByType('Position')" style="background:white;padding:20px;border-radius:8px;text-align:center;box-shadow:0 4px 6px rgba(0,0,0,0.1);cursor:pointer;transition:all 0.2s ease;">
        <div id="positions" style="font-size:28px;font-weight:bold;color:#ff9800;">-</div>

    </div>
    <div class="stat-box" data-type="Project" onclick="filterByType('Project')" style="background:white;padding:20px;border-radius:8px;text-align:center;box-shadow:0 4px 6px rgba(0,0,0,0.1);cursor:pointer;transition:all 0.2s ease;">
        <div id="projects" style="font-size:28px;font-weight:bold;color:#9c27b0;">-</div>
        <div data-translate="projects" style="color:#666;font-size:12px;">Projects</div>
    </div>
    <div class="stat-box" data-type="Skill" onclick="filterByType('Skill')" style="background:white;padding:20px;border-radius:8px;text-align:center;box-shadow:0 4px 6px rgba(0,0,0,0.1);cursor:pointer;transition:all 0.2s ease;">
        <div id="skills" style="font-size:28px;font-weight:bold;color:#f44336;">-</div>
        <div data-translate="skills" style="color:#666;font-size:12px;">Skills</div>
    </div>
    <div class="stat-box" data-type="Relation" onclick="filterByType('Relation')" style="background:white;padding:20px;border-radius:8px;text-align:center;box-shadow:0 4px 6px rgba(0,0,0,0.1);cursor:pointer;transition:all 0.2s ease;">
        <div id="edges" style="font-size:28px;font-weight:bold;color:#607d8b;">-</div>

    </div>
</div>

<!-- Filter Status -->
<div id="filter-status" style="display:none;background:#e3f2fd;color:#1976d2;padding:12px 20px;border-radius:8px;margin-bottom:20px;text-align:center;font-weight:bold;">
    <span id="filter-status-text"></span>
    <button onclick="clearTypeFilter()" style="margin-left:15px;padding:6px 12px;background:#1976d2;color:white;border:none;border-radius:4px;cursor:pointer;">✕ <span data-i18n="filterClear">Clear</span></button>
</div>

<!-- Nodes List -->
<div style="background:white;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 4px 6px rgba(0,0,0,0.1);">
    <h2 data-translate="allNodes" style="margin:0 0 15px 0;color:#333;">🖊️ All Nodes</h2>
    <div id="nodes" style="max-height:300px;overflow-y:auto;"><span data-i18n="loading">Loading...</span></div>
</div>

<!-- Edges List -->
<div style="background:white;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 4px 6px rgba(0,0,0,0.1);">
    <h2 data-translate="allRelationships" style="margin:0 0 15px 0;color:#333;">🔗 All Relationships</h2>
    <div id="edges-list" style="max-height:200px;overflow-y:auto;"><span data-i18n="loading">Loading...</span></div>
</div>

<!-- Search -->
<div style="background:white;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 4px 6px rgba(0,0,0,0.1);">
    <h2 data-translate="search" style="margin:0 0 15px 0;color:#333;">🔍 Search</h2>
    <input type="text" id="search" data-translate="searchPlaceholder" placeholder="Type to search..." 
           style="width:100%;padding:12px;font-size:16px;border:2px solid #ddd;border-radius:6px;box-sizing:border-box;"
           oninput="handleSearch(this.value)">
    <div id="search-results" style="margin-top:15px;"></div>
</div>

<!-- Sample Data -->
<div style="background:white;border-radius:12px;padding:20px;box-shadow:0 4px 6px rgba(0,0,0,0.1);">
    <h2 data-translate="sampleEmployees" style="margin:0 0 15px 0;color:#333;">👥 Sample Employees</h2>
    <div id="employees-list"></div>
</div>

</div>

<script>
// Translations
const translations = {
    en: {

        openGraph: '🎨 Open Visual Graph View',

        sampleEmployees: '👥 Employés Exemples',
        filterByType: 'Filtrer par type: {type}',
        showingType: '{count} nœuds {type} affichés'
    },
    it: {
        title: 'Grafico della Conoscenza HR',
        openGraph: '🎨 Apri Visualizzazione Grafico',
        openFalkorDB: '🗄️ Browser FalkorDB',
        loading: 'Caricamento...',
        loaded: 'Caricato',
        nodes: 'nodi',
        edges: 'archi',
        noMatches: 'Nessuna corrispondenza',
        noRelationships: 'Nessuna relazione',
        employees: 'Dipendenti',

        skills: 'Competenze',
        relations: 'Relazioni',
        allNodes: '🖊️ Tutti i Nodi',
        allRelationships: '🔗 Tutte le Relazioni',
        search: '🔍 Cerca',
        searchPlaceholder: 'Digita per cercare...',
        sampleEmployees: '👥 Dipendenti Esempio',
        filterByType: 'Filtra per tipo: {type}',
        showingType: 'Visualizzazione di {count} nodi {type}'
    },
    de: {
        title: 'HR Wissensgraph',
        openGraph: '🎨 Grafische Ansicht Öffnen',
        openFalkorDB: '🗄️ FalkorDB Browser',
        loading: 'Laden...',
        loaded: 'Geladen',
        nodes: 'Knoten',
        edges: 'Kanten',
        noMatches: 'Keine Übereinstimmungen',
        noRelationships: 'Keine Beziehungen',
        employees: 'Mitarbeiter',
        departments: 'Abteilungen',
        positions: 'Positionen',
        projects: 'Projekte',
        skills: 'Fähigkeiten',
        relations: 'Beziehungen',
        allNodes: '🖊️ Alle Knoten',
        allRelationships: '🔗 Alle Beziehungen',
        search: '🔍 Suchen',
        searchPlaceholder: 'Tippen zum Suchen...',
        sampleEmployees: '👥 Beispiel-Mitarbeiter',
        filterByType: 'Filtern nach Typ: {type}',
        showingType: '{count} {type}-Knoten werden angezeigt'
    }
};

// Current language
let currentLang = localStorage.getItem('language') || 'en';

// Node colors
const colors = {
    'Employee': '#667eea',
    'Department': '#4caf50',
    'Position': '#ff9800',
    'Project': '#e91e63',
    'Skill': '#00bcd4'
};

function getType(label) {
    const l = label.toLowerCase().trim();
    
    // Remove common name substrings from skill matching to prevent false positives
    const nameSubstrings = ['john', 'smith', 'jones', 'williams', 'brown', 'davis', 'miller', 'wilson', 'moore', 'taylor', 'anderson', 'thomas', 'jackson', 'white', 'harris', 'martin', 'thompson', 'garcia', 'martinez', 'robinson', 'clark', 'rodriguez', 'lewis', 'lee', 'walker', 'hall', 'allen', 'young', 'hernandez', 'king', 'wright', 'lopez', 'hill', 'scott', 'green', 'adams', 'baker', 'nelson', 'carter', 'mitchell', 'perez', 'roberts', 'turner', 'phillips', 'campbell', 'parker', 'evans', 'edwards', 'collins', 'stewart', 'sanchez', 'morris', 'murphy', 'cook', 'rogers', 'gutierrez', 'ortiz', 'morgan', 'cooper', 'peterson', 'bailey', 'reed', 'kelly', 'howard', 'ramos', 'kim', 'cox', 'ward', 'richardson', 'watson', 'brooks', 'chavez', 'wood', 'james', 'bennett', 'gray', 'mendoza', 'ruiz', 'hughes', 'price', 'alvarez', 'castillo', 'sanders', 'patel', 'myers', 'ross', 'foster', 'jimenez', 'powell', 'jenkins', 'perry', 'russell', 'sullivan', 'bell', 'coleman', 'butler', 'henderson', 'barnes', 'gonzales', 'fisher', 'vasquez', 'simmons', 'romero', 'jordan', 'patterson', 'alexander', 'hamilton', 'graham', 'kumar', 'singh', 'sharma', 'tiwari', 'gupta', 'wang', 'zhang', 'chen', 'liu', 'yang', 'huang', 'zhao', 'wu', 'zhou', 'xu', 'sun', 'lu', 'hu', 'guo', 'lin', 'cao', 'luo', 'ming', 'wei', 'yu', 'xie', 'tang', 'deng', 'cui', 'peng', 'zou', 'liang', 'lai', 'feng', 'bao', 'shi', 'su', 'ren', 'mao'];
    for (const namePart of nameSubstrings) {
        if (l === namePart) return 'Employee';
    }
    
    // FIRST: Check for departments (BEFORE skills - departments take priority)
    const departments = ['engineering', 'human resources', 'sales', 'marketing', 'finance', 'hr', 'it', 'operations', 'legal', 'design', 'product', 'research', 'customer success'];
    if (departments.includes(l) || l === 'human resources' || l === 'customer success') return 'Department';
    if (l.includes('department') || l.includes('dept')) return 'Department';
    
    // SECOND: Check for single-word position titles (CTO, CFO, CEO, etc.)
    const positionTitles = ['cto', 'cfo', 'ceo', 'coo', 'cio', 'cmo', 'chro', 'cpo', 'ciso'];
    if (positionTitles.includes(l)) return 'Position';
    
    // Check for common position single words
    if (l === 'auditor' || l === 'analyst' || l === 'architect') return 'Position';
    
    // THIRD: Check for projects
    if (l.includes('project') || l.includes('campaign')) return 'Project';
    
    // FOURTH: Check for skills (comprehensive lists)
    // Note: Only check skills with 2+ characters to avoid false positives like 'r' matching any name
    const techSkills = [
        // Programming languages (removed single-char 'r')
        'python', 'javascript', 'java', 'go', 'golang', 'rust', 'typescript', 'csharp', 'cpp', 'c++', 'ruby', 'php', 'swift', 'kotlin', 'scala', 'matlab', 'perl', 'bash', 'shell',
        // Databases
        'sql', 'nosql', 'mongodb', 'postgresql', 'mysql', 'redis', 'elasticsearch', 'cassandra', 'oracle', 'sqlite', 'mariadb', 'dynamodb', 'firestore', 'neptune',
        // Cloud & DevOps
        'aws', 'azure', 'gcp', 'kubernetes', 'docker', 'terraform', 'ansible', 'jenkins', 'circleci', 'github actions', 'gitlab ci', 'ci/cd', 'devops', 'cloud', 'serverless', 'lambda', 'ecs', 'eks', 'cloudformation', 'openstack',
        // ML/AI
        'tensorflow', 'pytorch', 'keras', 'scikit', 'pandas', 'numpy', 'matplotlib', 'opencv', 'nlp', 'machine learning', 'deep learning', 'computer vision', 'neural network', 'ai', 'ml', 'dl', 'data science', 'data engineering', 'spark', 'hadoop', 'hive', 'airflow', 'databricks',
        // Frontend
        'react', 'reactjs', 'vue', 'vuejs', 'angular', 'svelte', 'html', 'css', 'sass', 'less', 'tailwind', 'bootstrap', 'jquery', 'nextjs', 'nuxt', 'gatsby',
        // Backend
        'node', 'nodejs', 'express', 'fastapi', 'django', 'flask', 'spring', 'springboot', 'rails', 'laravel', 'asp.net', 'graphql', 'rest', 'api', 'microservices',
        // Other tech
        'blockchain', 'ethereum', 'solidity', 'iot', 'vr', 'cyber security', 'penetration testing', 'ethical hacking', 'forensics', 'cryptography',
        // Tools
        'git', 'github', 'gitlab', 'bitbucket', 'jira', 'confluence', 'figma', 'sketch', 'adobe', 'photoshop', 'illustrator', 'xd', 'zeplin', 'invision'
    ];
    
    const softSkills = [
        'leadership', 'communication', 'teamwork', 'collaboration', 'problem solving', 'analytical', 'management', 'project management', 'agile', 'scrum', 'negotiation', 'presentation', 'time management', 'critical thinking', 'creativity', 'adaptability', 'mentoring', 'coaching', 'strategic thinking', 'decision making', 'conflict resolution', 'customer service', 'public speaking', 'written communication', 'interpersonal skills', 'organizational skills', 'attention to detail', 'troubleshooting', 'research', 'planning', 'prioritization'
    ];
    
    const domainSkills = [
        // Business (removed partial matches like 'hris' which matches 'christopher')
        'analytics', 'data analysis', 'business analysis', 'financial analysis', 'market research', 'seo', 'sem', 'ppc', 'crm', 'erp', 'branding', 'content strategy', 'copywriting', 'social media', 'email marketing', 'affiliate marketing', 'growth hacking',
        // Finance
        'budgeting', 'forecasting', 'financial planning', 'accounting', 'auditing', 'tax', 'compliance', 'risk management', 'investments', 'treasury', 'controller',
        // HR (use full 'hr management' instead of 'hris' to avoid partial matches)
        'recruitment', 'talent acquisition', 'onboarding', 'training', 'development', 'performance management', 'compensation', 'benefits', 'employee relations', 'hr management', 'workday',
        // Design
        'ui/ux', 'ui design', 'ux design', 'visual design', 'graphic design', 'typography', 'illustration', 'icon design', 'motion design', 'interaction design', 'prototyping', 'wireframing', 'user research', 'usability testing',
        // Product
        'product management', 'product strategy', 'roadmap', 'stakeholder management', 'user stories', 'agile', 'kanban', 'lean',
        // Operations
        'logistics', 'supply chain', 'procurement', 'inventory', 'manufacturing', 'quality assurance', 'qa', 'testing', 'automation',
        // Legal
        'contracts', 'intellectual property', 'corporate law', 'employment law', 'regulatory',
        // Science
        'chemistry', 'biology', 'physics', 'statistics', 'experimental design'
    ];
    
    const allSkills = [...techSkills, ...softSkills, ...domainSkills];
    
    // Check if label matches any skill pattern (2+ char matches only)
    for (const skill of allSkills) {
        if (l.includes(skill)) return 'Skill';
    }
    
    // FIFTH: Position check (multi-word positions)
    if (l.includes('position') || l.includes('engineer') || l.includes('manager') || 
        l.includes('director') || 
        l.includes('analyst') || l.includes('developer') || l.includes('architect') || 
        l.includes('consultant') || l.includes('specialist') || l.includes('coordinator') || 
        l.includes('supervisor') || l.includes('administrator') || l.includes('assistant') || 
        l.includes('advisor') || l.includes('lead') || l.includes('head') ||
        l.includes('officer') || l.includes('president') || l.includes('vice') ||
        l.includes('senior') || l.includes('junior') || l.includes('associate') || l.includes('intern') || l.includes('rep') || l.includes('fellow')) return 'Position';
    
    // SIXTH: Employee name check (2-4 words that look like human names)
    const words = l.split(' ').filter(w => w.length > 0);
    if (words.length >= 2 && words.length <= 4) {
        // Check if it looks like a human name (not a skill/position title)
        const isLikelyName = words.every(word => {
            if (word.length < 2) return false;
            const skillKeywords = [
                'python', 'javascript', 'java', 'react', 'node', 'manager', 'engineer', 'developer', 
                'director', 'analyst', 'consultant', 'specialist', 'coordinator', 'supervisor', 
                'administrator', 'architect', 'lead', 'head', 'chief', 'officer', 'president', 
                'vice', 'senior', 'junior', 'associate', 'intern', 'fellow', 'project', 'campaign', 
                'department', 'team', 'group', 'science', 'analysis', 'engineering', 
                'visualization', 'computing', 'security', 'development', 'testing', 'quality', 
                'design', 'management', 'marketing', 'sales', 'finance', 'recruitment',
                'product', 'analytics', 'strategy', 'operations', 'research'
            ];
            return !skillKeywords.some(keyword => word.includes(keyword));
        });
        if (isLikelyName) return 'Employee';
    }
    
    // SEVENTH: Single word fallback
    if (words.length === 1) {
        return 'Skill';
    }
    
    // Default fallback
    return 'Employee';
}

function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('language', lang);
    
    // Update button styles
    document.querySelectorAll('[id^="lang-"]').forEach(btn => {
        btn.style.background = '#f0f0f0';
        btn.style.color = '#667eea';
    });
    document.getElementById('lang-' + lang).style.background = '#667eea';
    document.getElementById('lang-' + lang).style.color = 'white';
    
    // Update text elements (exclude dynamic content areas)
    const t = translations[lang];
    document.querySelectorAll('[data-translate]:not(#nodes):not(#edges-list):not(#employees-list):not(#status)').forEach(elem => {
        const key = elem.getAttribute('data-translate');
        if (t[key]) {
            if (elem.tagName === 'INPUT') {
                elem.placeholder = t[key];
            } else {
                elem.textContent = t[key];
            }
        }
    });
}

let currentFilterType = null;
let allGraphData = null;
let originalStats = null;

function filterByType(type) {
    if (!allGraphData || !originalStats) return;
    
    currentFilterType = type;
    const t = translations[currentLang];
    
    // Get filtered nodes count
    const filteredNodes = allGraphData.nodes.filter(n => getType(n.label) === type);
    
    // Update filter status
    const filterStatus = document.getElementById('filter-status');
    const filterStatusText = document.getElementById('filter-status-text');
    filterStatus.style.display = 'block';
    const typeLabel = t[type.toLowerCase()] || t[type] || type;
    filterStatusText.textContent = t.filterByType.replace('{type}', typeLabel) + ' - ' + t.showingType.replace('{count}', filteredNodes.length).replace('{type}', typeLabel.toLowerCase());
    
    // Highlight selected stat box
    document.querySelectorAll('.stat-box').forEach(box => {
        if (box.dataset.type === type) {
            box.style.border = '3px solid #667eea';
            box.style.transform = 'scale(1.05)';
        } else {
            box.style.border = 'none';
            box.style.transform = 'scale(1)';
            box.style.opacity = '0.5';
        }
    });
    
    // Update nodes list to show only filtered nodes
    updateNodesList(filteredNodes);
}

function clearTypeFilter() {
    if (!allGraphData || !originalStats) return;
    
    currentFilterType = null;
    
    // Hide filter status
    document.getElementById('filter-status').style.display = 'none';
    
    // Reset stat boxes
    document.querySelectorAll('.stat-box').forEach(box => {
        box.style.border = 'none';
        box.style.transform = 'scale(1)';
        box.style.opacity = '1';
    });
    
    // Show all nodes
    updateNodesList(allGraphData.nodes);
}

function updateNodesList(nodes) {
    let nodesHtml = '<div style="display:flex;flex-wrap:wrap;gap:8px;">';
    nodes.forEach(n => {
        const type = getType(n.label);
        nodesHtml += `<span style="background:${colors[type]};color:white;padding:6px 12px;border-radius:20px;font-size:13px;">${n.label}</span>`;
    });
    nodesHtml += '</div>';
    document.getElementById('nodes').innerHTML = nodesHtml;
}

function init() {
    console.log('init() called');

    console.log('Fetching /graph...');
    fetch('/graph')
        .then(r => {
            console.log('Fetch response status:', r.status);
            if (!r.ok) throw new Error('Server error: ' + r.status);
            return r.json();
        })
        .then(data => {
            console.log('Data received:', data.nodes.length, 'nodes,', data.edges.length, 'edges');
            allGraphData = data;
            
            // Update stats
            const stats = { Employee: 0, Department: 0, Position: 0, Project: 0, Skill: 0 };
            const employees = [];
            
            data.nodes.forEach(n => {
                const type = getType(n.label);
                stats[type]++;
                if (type === 'Employee') employees.push(n.label);
            });
            
            // Store original stats for reference
            originalStats = { ...stats };
            
            document.getElementById('employees').textContent = stats.Employee;
            document.getElementById('departments').textContent = stats.Department;
            document.getElementById('positions').textContent = stats.Position;
            document.getElementById('projects').textContent = stats.Project;
            document.getElementById('skills').textContent = stats.Skill;
            document.getElementById('edges').textContent = data.edges.length;
            
            // Show nodes (sorted alphabetically)
            let nodesHtml = '<div style="display:flex;flex-wrap:wrap;gap:8px;">';
            const sortedNodes = [...data.nodes].sort((a, b) => a.label.localeCompare(b.label));
            sortedNodes.forEach(n => {
                const type = getType(n.label);
                nodesHtml += `<span style="background:${colors[type]};color:white;padding:6px 12px;border-radius:20px;font-size:13px;">${n.label}</span>`;
            });
            nodesHtml += '</div>';
            document.getElementById('nodes').innerHTML = nodesHtml;
            
            // Show edges (sorted alphabetically)
            let edgesHtml = '';
            const sortedEdges = [...data.edges].sort((a, b) => {
                const labelA = (a.label || '').toLowerCase();
                const labelB = (b.label || '').toLowerCase();
                return labelA.localeCompare(labelB);
            });
            sortedEdges.forEach(e => {
                edgesHtml += `<div style="background:#f0f0f0;padding:6px 10px;border-radius:4px;margin:4px 0;font-size:12px;font-family:monospace;">
                    <strong>${e.label || 'REL'}</strong>: ${e.source} → ${e.target}
                </div>`;
            });
            document.getElementById('edges-list').innerHTML = edgesHtml || '<p data-i18n="noRelationships" style="color:#666;">No relationships</p>';
            
            // Show employees (sorted alphabetically)
            const sortedEmployees = [...employees].sort((a, b) => a.localeCompare(b));
            document.getElementById('employees-list').innerHTML = 
                '<div style="display:flex;flex-wrap:wrap;gap:8px;">' +
                sortedEmployees.slice(0, 10).map(e => 
                    `<span style="background:${colors.Employee};color:white;padding:8px 16px;border-radius:20px;">👤 ${e}</span>`
                ).join('') + '</div>';
            
            document.getElementById('status').innerHTML = '✅ <span data-i18n="loaded">Loaded</span>: ' + data.nodes.length + ' <span data-i18n="nodes">nodes</span>, ' + data.edges.length + ' <span data-i18n="edges">edges</span>';
            document.getElementById('status').style.background = '#e8f5e9';
            document.getElementById('status').style.color = '#2e7d32';
        })
        .catch(err => {
            console.error('Error loading graph:', err);
            document.getElementById('status').innerHTML = '❌ <span data-i18n="error">Error</span>: ' + err.message;
            document.getElementById('status').style.background = '#ffebee';
            document.getElementById('status').style.color = '#c62828';
        });
}

function handleSearch(q) {
    if (!q || q.length < 2) {
        document.getElementById('search-results').innerHTML = '';
        return;
    }
    fetch('/graph')
        .then(r => r.json())
        .then(data => {
            const matches = data.nodes.filter(n => n.label.toLowerCase().includes(q.toLowerCase()));
            if (matches.length === 0) {
                document.getElementById('search-results').innerHTML = '<p style="color:#666;" data-i18n="noMatches">No matches</p>';
            } else {
                document.getElementById('search-results').innerHTML = 
                    '<div style="display:flex;flex-wrap:wrap;gap:8px;">' +
                    matches.map(m => {
                        const type = getType(m.label);
                        return `<span style="background:${colors[type]};color:white;padding:8px 16px;border-radius:20px;">${m.label}</span>`;
                    }).join('') + '</div>';
            }
        });
}

// Initialize language
setLanguage(currentLang);

init();
</script>

</body>
</html>
